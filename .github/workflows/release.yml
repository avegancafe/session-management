name: Release to marketplace

# When this plugin's version changes on main, tell avegancafe-marketplace so it
# can update its entry (its sync-plugin-versions workflow does the rest).
# Needs the MARKETPLACE_DISPATCH_TOKEN secret: a fine-grained PAT scoped to
# avegancafe/avegancafe-marketplace with Contents: read & write.

on:
  push:
    branches: [main]
    paths: ['.claude-plugin/plugin.json']
  workflow_dispatch:

jobs:
  notify-marketplace:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - name: Send plugin-released to avegancafe-marketplace
        env:
          GH_TOKEN: ${{ secrets.MARKETPLACE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::MARKETPLACE_DISPATCH_TOKEN is not set — the marketplace entry was NOT updated. See CLAUDE.md."
            exit 1
          fi
          name=$(jq -r .name .claude-plugin/plugin.json)
          version=$(jq -r .version .claude-plugin/plugin.json)
          jq -n --arg n "$name" --arg v "$version" --arg s "$GITHUB_SHA" \
            '{event_type: "plugin-released", client_payload: {name: $n, version: $v, sha: $s}}' \
            | gh api repos/avegancafe/avegancafe-marketplace/dispatches --input -
          echo "Sent plugin-released: $name $version"
